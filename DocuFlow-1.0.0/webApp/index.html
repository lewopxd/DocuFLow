<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuFlow Engine Playground</title>
    <style>
        /* --- Reseteo y Estilo Base --- */
        :root {
            --resizer-width: 8px;
            --panel-background: rgba(37, 37, 38, 0.5); /* Un poco más opaco para legibilidad */
            --border-color: rgba(255, 255, 255, 0.15);
            --dashed-border-color: rgba(255, 255, 255, 0.3);
            --hover-color: #007acc;
            --font-color: #cccccc;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --tab-bg: rgba(45, 45, 45, 0.6);
            --tab-height: 22px; /* Altura de pestañas reducida */
            --gradient-color-top-left: #00ff99; /* Verde */
            --gradient-color-bottom-right: #00c9ff; /* Azul */
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-family);
            color: var(--font-color);
            background-color: #1e1e1e; /* Fallback color */
            
            /* --- Fondo SVG de Alta Calidad integrado en CSS --- */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g1" gradientTransform="rotate(135)"><stop offset="0%" stop-color="%231e1e1e"/><stop offset="50%" stop-color="%232d2d30"/><stop offset="100%" stop-color="%231a2a3a"/></linearGradient><radialGradient id="g2" cx="0" cy="0" r="80%"><stop offset="0%" stop-color="%2300ff99" stop-opacity="0.25"/><stop offset="100%" stop-color="%231e1e1e" stop-opacity="0"/></radialGradient><radialGradient id="g3" cx="100%" cy="100%" r="80%"><stop offset="0%" stop-color="%2300c9ff" stop-opacity="0.25"/><stop offset="100%" stop-color="%231e1e1e" stop-opacity="0"/></radialGradient></defs><rect width="100%" height="100%" fill="url(%23g1)"/><rect width="100%" height="100%" fill="url(%23g2)"/><rect width="100%" height="100%" fill="url(%23g3)"/></svg>');
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* --- Contenedor Principal (Flexbox) --- */
        .main-container {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Estilos Comunes de Paneles --- */
        .panel {
            background-color: var(--panel-background);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            overflow: hidden;
            min-width: 200px;
            transition: background-color 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        #left-panel { flex-basis: 50%; flex-grow: 0; flex-shrink: 0; }
        #right-panel { flex-grow: 1; }

        /* --- Estilos Comunes de Barra de Herramientas --- */
        .panel-toolbar {
            padding: 10px 20px 0 20px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .toolbar-actions { margin-bottom: 10px; }
        .toolbar-tabs { display: flex; justify-content: flex-end; }
        
        /* --- Estilos de Pestañas --- */
        .tab {
            background-color: var(--tab-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            height: var(--tab-height);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            margin: 0 0.5px;
            position: relative;
            bottom: -1px; /* Se superpone 1px sobre el borde inferior del toolbar */
            padding: 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            min-width: 5px;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
        }
        .tab:hover { background-color: rgba(55, 55, 56, 0.8); }
        .tab.active {
            margin: 0 4px;
            padding: 0 11px;
            border-width: 1px;
            border-style: solid;
            color: #ffffff;
        }
        
        /* --- Tema Verde: Panel Izquierdo (Datos) --- */
        #left-panel .panel-toolbar { border-bottom: 1px solid var(--gradient-color-top-left); }
        #left-panel .tab {
            border-bottom-color: var(--gradient-color-top-left);
        }
        #left-panel .tab.active {
            background-color: #00ff9922; /* Tinte verde */
            border-top-color: var(--gradient-color-top-left);
            border-left-color: var(--gradient-color-top-left);
            border-right-color: var(--gradient-color-top-left);
            border-bottom-color: var(--panel-background);
        }

        /* --- Tema Azul: Panel Derecho (Plantillas) --- */
        #right-panel .panel-toolbar { border-bottom: 1px solid var(--gradient-color-bottom-right); }
        #right-panel .tab {
             border-bottom-color: var(--gradient-color-bottom-right);
        }
        #right-panel .tab.active {
            background-color: #00c9ff22; /* Tinte azul */
            border-top-color: var(--gradient-color-bottom-right);
            border-left-color: var(--gradient-color-bottom-right);
            border-right-color: var(--gradient-color-bottom-right);
            border-bottom-color: var(--panel-background);
        }

        /* --- Iconos y Contenido --- */
        .icon-button {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .icon-button:hover { background-color: rgba(255, 255, 255, 0.1); border-color: var(--hover-color); }
        .icon-button svg { width: 18px; height: 18px; }
        
        .panel-content { 
            padding: 0; /* El padding ahora lo controla el contenido absoluto */
            flex-grow: 1; 
            position: relative; /* Contexto para la animación */
        }
        
        @keyframes contentFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tab-content {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            overflow: auto; /* Scroll solo si es necesario dentro de la pestaña */
        }

        .tab-content.active {
            display: block;
            animation: contentFadeIn 0.4s ease-out forwards;
        }

        .placeholder { color: rgba(255, 255, 255, 0.6); height: 100%;}
        .placeholder-frame { border: 1px dashed var(--dashed-border-color); border-radius: 6px; padding: 20px; height: 100%; box-sizing: border-box; }
        .placeholder h2 { margin-top: 0; color: #fff; font-weight: 500; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
        
        /* --- Barra de Arrastre (Resizer) --- */
        .resizer {
            width: var(--resizer-width);
            background-color: transparent;
            cursor: col-resize;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 4px;
        }
        .resizer::after {
            content: '';
            width: 2px;
            height: 40px;
            background-color: var(--border-color);
            border-radius: 2px;
            transition: background-color 0.2s ease;
        }
        .resizer:hover::after { background-color: var(--hover-color); }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Panel Izquierdo: Contendrá la tabla de datos de Sheets -->
        <div id="left-panel" class="panel">
            <div class="panel-toolbar">
                <div class="toolbar-actions">
                    <button class="icon-button" title="Cargar hoja de datos">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </button>
                </div>
                <div class="toolbar-tabs" id="left-tabs">
                    <div class="tab">Datos</div>
                    <div class="tab">Mapeo</div>
                    <div class="tab">Filtros</div>
                </div>
            </div>
            <div class="panel-content">
                <!-- El contenido se generará dinámicamente aquí -->
                <div class="placeholder" style="display: none;"> <!-- Plantilla Oculta -->
                    <div class="placeholder-frame">
                        <h2>Panel de Datos</h2>
                        <p>Aquí se visualizarán los datos del archivo de Google Sheets.</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="resizer" class="resizer"></div>

        <!-- Panel Derecho: Contendrá las plantillas y variables -->
        <div id="right-panel" class="panel">
            <div class="panel-toolbar">
                <div class="toolbar-actions">
                    <button class="icon-button" title="Cargar template">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    </button>
                </div>
                <div class="toolbar-tabs" id="right-tabs">
                    <div class="tab">Plantilla 1</div>
                    <div class="tab">Plantilla 2</div>
                    <div class="tab">Plantilla 3</div>
                </div>
            </div>
            <div class="panel-content">
                 <!-- El contenido se generará dinámicamente aquí -->
                <div class="placeholder" style="display: none;"> <!-- Plantilla Oculta -->
                     <div class="placeholder-frame">
                         <h2>Panel de Plantillas</h2>
                         <p>Aquí se mostrarán las variables encontradas en las plantillas de Word cargadas.</p>
                     </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Lógica para la Barra de Arrastre Funcional ---
        const resizer = document.getElementById('resizer');
        const leftPanel = document.getElementById('left-panel');
        const mainContainer = document.querySelector('.main-container');
        let isResizing = false;
        resizer.addEventListener('mousedown', function(e) {
            e.preventDefault();
            isResizing = true;
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        });
        function handleMouseMove(e) {
            if (!isResizing) return;
            const containerRect = mainContainer.getBoundingClientRect();
            const minWidthPx = 200;
            let leftWidth = e.clientX - containerRect.left;
            if (leftWidth < minWidthPx) leftWidth = minWidthPx;
            if (leftWidth > containerRect.width - minWidthPx - resizer.offsetWidth) {
                leftWidth = containerRect.width - minWidthPx - resizer.offsetWidth;
            }
            leftPanel.style.flexBasis = leftWidth + 'px';
        }
        function handleMouseUp() {
            isResizing = false;
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);
        }

        /**
         * Initializes a tab system for a given panel.
         * It dynamically creates content panes for each tab and handles the switching logic.
         * @param {string} panelId - The ID of the panel element (e.g., 'left-panel').
         */
        function setupTabSystem(panelId) {
            const panel = document.getElementById(panelId);
            if (!panel) return;

            const tabsContainer = panel.querySelector('.toolbar-tabs');
            const contentContainer = panel.querySelector('.panel-content');
            const placeholderTemplate = panel.querySelector('.placeholder');
            const tabs = tabsContainer.querySelectorAll('.tab');

            if (!placeholderTemplate || tabs.length === 0) return;

            const placeholderHtml = placeholderTemplate.innerHTML;

            tabs.forEach((tab, index) => {
                // Create the content div for this tab
                const contentPane = document.createElement('div');
                contentPane.className = 'tab-content';
                const panelName = panelId.replace('-panel', '');
                contentPane.id = `${panelName}-tab-content-${index}`;
                contentPane.innerHTML = placeholderHtml;
                contentContainer.appendChild(contentPane);

                // Assign a data attribute to the tab to link it to its content pane
                tab.dataset.tabTarget = `#${contentPane.id}`;

                // Add click listener
                tab.addEventListener('click', () => {
                    // Deactivate all tabs and content panes within this panel
                    tabs.forEach(t => t.classList.remove('active'));
                    contentContainer.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                    // Activate the clicked tab and its corresponding content
                    tab.classList.add('active');
                    const targetPane = document.querySelector(tab.dataset.tabTarget);
                    if (targetPane) {
                        targetPane.classList.add('active');
                    }
                });
            });

            // Activate the first tab and its content by default
            if (tabs.length > 0) {
                tabs[0].classList.add('active');
                const firstContentPane = document.querySelector(tabs[0].dataset.tabTarget);
                if (firstContentPane) {
                    firstContentPane.classList.add('active');
                }
            }
        }

        // Initialize both tab systems when the document is ready
        document.addEventListener('DOMContentLoaded', () => {
            setupTabSystem('left-panel');
            setupTabSystem('right-panel');
        });
    </script>

</body>
</html>
