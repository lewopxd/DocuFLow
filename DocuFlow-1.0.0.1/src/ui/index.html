<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuFlow Engine Playground</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="main-container">
        <div id="left-panel" class="panel">
            <div class="panel-toolbar">
                <div class="toolbar-actions">
                    <button class="icon-button" id="load-sheet-button" title="Cargar hoja de datos">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="toolbar-tabs" id="left-tabs">
                    </div>
            </div>
            <div class="panel-content">
                <div class="placeholder">
                    <div class="placeholder-frame">
                        <h2>Panel de Datos</h2>
                        <p>Aquí se visualizarán los datos del archivo de Google Sheets.</p>
                    </div>
                </div>
                </div>
        </div>

        <div id="resizer" class="resizer"></div>

        <div id="right-panel" class="panel">
            <div class="panel-toolbar">
                <div class="toolbar-actions">
                    <button class="icon-button" id="load-template-button" title="Cargar template">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="12" y1="18" x2="12" y2="12"></line>
                            <line x1="9" y1="15" x2="15" y2="15"></line>
                        </svg>
                    </button>
                </div>
                <div class="toolbar-tabs" id="right-tabs">
                    </div>
            </div>
            <div class="panel-content">
                <div class="placeholder">
                    <div class="placeholder-frame">
                        <h2>Panel de Plantillas</h2>
                        <p>Aquí se mostrarán las variables encontradas en las plantillas de Word cargadas.</p>
                    </div>
                </div>
                </div>
        </div>
    </div>

    <script src="js/bridge.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
